name: Destroy

# Manual teardown of everything Terraform created (RDS, VPC, Lambdas, buckets...).
# The bootstrap stack (OIDC role and state bucket) is removed from the AWS console.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=globant-poc/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform destroy -input=false -auto-approve -var="image_tag=destroy"
