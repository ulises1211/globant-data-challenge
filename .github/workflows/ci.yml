name: CI

# Every pull request: tests + Terraform checks + a plan (nothing is applied).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # needed for the OIDC login to AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globant
          POSTGRES_PASSWORD: globant
          POSTGRES_DB: globant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U globant"
          --health-interval 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://globant:globant@localhost:5432/globant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format and validate (no AWS access needed)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=globant-poc/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -input=false -lock=false -var="image_tag=pr-plan"
