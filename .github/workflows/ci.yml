name: CI

# Every pull request: tests + Terraform checks + a plan (nothing is applied).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # needed for the OIDC login to AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globant
          POSTGRES_PASSWORD: globant
          POSTGRES_DB: globant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U globant"
          --health-interval 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://globant:globant@localhost:5432/globant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format and validate (no AWS access needed)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      # TEMPORARY: shows what GitHub sends to AWS so a trust-policy mismatch is visible.
      # Prints claims only (never the token). Remove once the login works.
      - name: Debug OIDC claims
        run: |
          echo "role arn: [${{ vars.AWS_ROLE_ARN }}]"
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print({k: claims.get(k) for k in ("sub", "aud", "iss", "repository", "event_name")})
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=globant-poc/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -input=false -lock=false -var="image_tag=pr-plan"
