name: Deploy

# Merge to main: build the image, push it to ECR and apply Terraform.
# The `production` environment asks for a manual approval before anything runs.
on:
  push:
    branches: [main]
    # Documentation-only changes do not need a deployment.
    paths-ignore:
      - "docs/**"
      - "README*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt an apply

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globant
          POSTGRES_PASSWORD: globant
          POSTGRES_DB: globant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U globant"
          --health-interval 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://globant:globant@localhost:5432/globant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # ECR tags are immutable, so a re-run of the same commit needs a fresh tag.
      TF_IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=globant-poc/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # The ECR repository must exist before an image can be pushed to it.
      - name: Create the ECR repository (first run only, harmless afterwards)
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app -var="image_tag=$TF_IMAGE_TAG"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Plain docker build (not buildx) so Lambda gets a single-platform image manifest.
      - name: Build and push the image
        working-directory: .
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/globant-poc:$TF_IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var="image_tag=$TF_IMAGE_TAG"

      - name: Show outputs
        run: terraform output
