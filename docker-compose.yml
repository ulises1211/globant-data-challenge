# Local environment: PostgreSQL + the same image that runs on Lambda.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: globant
      POSTGRES_PASSWORD: globant
      POSTGRES_DB: globant
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globant"]
      interval: 3s
      retries: 10

  api:
    build: .
    entrypoint: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://globant:globant@db:5432/globant
      API_KEY: dev-key
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./data:/var/task/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
